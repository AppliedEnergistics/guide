name: Publish

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Update the guide twice daily
  schedule:
    - cron: "30 3,15 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      # All guide versions are rendered by the guide website generator of the current Applied Energistics 2 version
      - name: Checkout Applied Energistics 2
        uses: actions/checkout@v4
        with:
          repository: AppliedEnergistics/Applied-Energistics-2
          ref: main
      - uses: ./.github/actions/gradle-setup
      # The guide export of each version is attached to the guide-data release as <version-folder>.zip
      - name: Download Guide Data
        run: |
          mkdir -p build/guide-data/zips
          gh release download guide-data -R "$GITHUB_REPOSITORY" --pattern '*.zip' --dir build/guide-data/zips
          for zip in build/guide-data/zips/*.zip; do
            unzip -q "$zip" -d "build/guide-data/versions/$(basename "$zip" .zip)"
          done
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        run: >-
          ./gradlew renderGuideWebsite
          -PguideWebsiteVersions=build/guide-data/versions
          -PguideWebsiteOutput=build/guide-site
          "-PguideWebsiteArgs=--site-url https://guide.appliedenergistics.org"
      # The previous website also served the start page of each version at /<version>/index
      - name: Redirect Old URLs
        working-directory: build/guide-site
        run: |
          for sitemap in */sitemap.xml; do
            version=$(dirname "$sitemap")
            mkdir -p "$version/index"
            cat > "$version/index/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><title>Redirecting</title>
          <link rel="canonical" href="https://guide.appliedenergistics.org/$version/">
          <meta http-equiv="refresh" content="0; url=/$version/"></head>
          <body><a href="/$version/">Applied Energistics 2 Guide for Minecraft $version</a></body></html>
          EOF
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/guide-site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
